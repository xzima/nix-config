{
  "lowMemoryMode": true,
  "serilog": false, // Disable logging
  "listen": {
    "version": true,
    "ip": "0.0.0.0",
    "port": 9118,
    "scheme": "https",
    "localhost": "127.0.0.1"
  },
  "BaseModule": {
    "SkipModules": [
      "SISI",
      "NextHUB",
      "TmdbProxy",
      "CubProxy",
      "Kit",
      "DLNA",
      "Transcoding",
      "GStreamer",
      "WebLog",
      "CacheMedia",
      "ProxyLimiter",
      "MsxNative",
      "WatchTogether",
      "AdminPanel",
      "TelegramAuth",
      "TelegramAuthBot",
      "Tg-notify.bot"
    ]
  },
  "chromium": {
    "enable": true,
    "executablePath": "/usr/bin/chromium"
  },
  "gst": {"enable": false},
  "openstat": {"enable": false},
  "online": {
    "name": "Lampac NextGen",
    "spiderName": "Lampac NextGen",
    "version": true,
    "btn_priority_forced": true
  },
  "LampaWeb": {
    "widgets": {
      "samsung": true,   // /samsung.wgt — Tizen
      "lg": true         // /lg.ipk — webOS
    },
    "customPlugins": [
      {"url": "{localhost}/p/etor.js", "status": 1},
      {"url": "{localhost}/p/tm.js", "status": 1},
      {"url": "{localhost}/p/tp.js", "status": 1},
      {"url": "{localhost}/sync/js/az", "status": 1},
      {"url": "{localhost}/p/prepare.js", "status": 1}
    ],
    "initPlugins": {
      "jacred": true,
      "torrserver": true,
      "online": true,
      "pirate_store": true,
      "sync": false,
      "timecode": false,
      "sisi": false,
      "tmdbProxy": false,
      "cubProxy": false
    }
  }
}
